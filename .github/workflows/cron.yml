name: Cron

# Delayed flow steps, broadcasts and sequence steps need a call about once a
# minute. Vercel Cron cannot do that on the Hobby plan — it only allows a daily
# schedule and rejects a faster expression at deploy time — so the schedule
# lives here instead. Point an external cron (cron-job.org) at the same two URLs
# if you need a tighter loop; the handlers claim jobs with a compare-and-set, so
# overlapping callers cannot double-process a job.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository variable to the deployed origin."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi

      - name: Run scheduled jobs
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/jobs"
          echo

      - name: Run sequence steps
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/sequences"
          echo
